<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ห้องให้เช่า — MAX Agent</title>
<meta name="description" content="รายละเอียดห้องให้เช่า ราคา รูป และช่องทางติดต่อเอเจนต์">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MAX Agent">
<meta property="og:title" content="ห้องให้เช่า — ดูรูปและรายละเอียด | MAX Agent">
<meta property="og:description" content="กดเพื่อดูรูปห้อง ราคา ทำเล และทักไลน์เอเจนต์ได้ทันที">
<meta property="og:url" content="https://banditkmc23-ai.github.io/Max-Real-Estate-Agent/room.html">
<meta name="twitter:card" content="summary">
<meta property="og:image" content="https://banditkmc23-ai.github.io/Max-Real-Estate-Agent/icons/icon-512.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Thai',-apple-system,sans-serif;background:#f7f4f1;color:#2b2420;font-size:15px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
#app{max-width:560px;margin:0 auto;padding-bottom:110px}
.mut{color:#8e8680;font-size:13px}.sec{padding:0 16px}.h2{font-size:17px;font-weight:600;margin-bottom:10px}
.car{position:relative;height:520px;max-height:68vh;min-height:360px;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,#cf7a56,#83401f)}
.trk{display:flex;height:100%}.trk img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;display:block}
.fade{position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(rgba(247,244,241,0),#f7f4f1);pointer-events:none}
.dots{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dot{width:6px;height:6px;border-radius:3px;background:#fff;opacity:.6;transition:.3s;box-shadow:0 0 3px #0003}.dot.on{width:18px;opacity:1}
.pill{position:absolute;top:max(16px,env(safe-area-inset-top));font-size:13px;font-weight:600;padding:4px 10px;border-radius:20px}
.card{background:#fff;border-radius:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0}.row+.row{border-top:1px solid #f0ebe7}.row b{font-weight:600;text-align:right}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid #eee;z-index:10}
.bar>div{max-width:560px;margin:0 auto;display:flex;gap:10px;padding:12px 16px max(14px,env(safe-area-inset-bottom))}
.btn{flex:1;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#fff}
#gal{position:fixed;inset:0;background:#000;z-index:50;display:none}
#gal.on{display:block}
#gtrk{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}#gtrk::-webkit-scrollbar{display:none}
#gtrk div{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center}
#gtrk img{max-width:100%;max-height:100%;object-fit:contain}
.gx{position:absolute;top:max(12px,env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);border:0;font-size:22px;right:12px}
.gc{position:absolute;top:max(18px,env(safe-area-inset-top));left:16px;color:#fff;background:rgba(0,0,0,.5);font-size:13px;padding:4px 10px;border-radius:20px}
.lay{display:flex;flex-direction:column}.colL,.colR{display:contents}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}
.thumbs,.ibtns{display:none}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.85);border:0;font-size:26px;cursor:pointer;display:none}
@media (hover:hover){.gnav{display:block}}
#gal{cursor:default}#gtrk img{cursor:zoom-out}
@media (min-width:601px){
 #app{max-width:760px}
 .car{height:600px;max-height:72vh;border-radius:0 0 22px 22px}
 .sec{padding:0 24px}
}
@media (min-width:1024px){
 body{background:#f2eeea}
 #app{max-width:1200px;padding:28px 28px 40px}
 .lay{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
 .colL,.colR{display:block}
 .colR{position:sticky;top:24px;background:#fff;border-radius:20px;padding:22px 4px 18px;box-shadow:0 6px 28px rgba(60,30,10,.08)}
 .colR .sec{padding:0 18px}.colR .card{background:#faf7f5}
 .car{height:560px;max-height:none;border-radius:20px}
 .fade{display:none}
 .colL .sec{padding:0}
 .thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}
 .thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:pointer;display:block;transition:.2s}.thumbs img:hover{opacity:.8}
 .ibtns{display:flex;gap:10px;padding:16px 18px 0}
 .bar{display:none}
 #app{padding-bottom:40px}
 .pill{top:16px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  const SB_URL = 'https://ekpavjlebbclapjdupwf.supabase.co', SB_KEY = 'sb_publishable_XJ1PWYWqWWN571OTaGpjRg_0owD5pyW';
  const B = '#c2552d';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const baht = n => '฿' + Number(n || 0).toLocaleString('th-TH');
  const ST = { AVAILABLE: ['● ว่าง พร้อมเข้าอยู่', '#1a8a4a'], RESERVED: ['● ติดจอง', '#b7791f'], OCCUPIED: ['● มีผู้เช่า (รับจองล่วงหน้า)', '#2b6cb0'], FOR_SALE: ['● ขาย', B] };
  const fromB64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; };
  async function decode(h) {
    const [ver, data] = [h.slice(0, 1), h.slice(2)];
    let bytes = fromB64u(data);
    if (ver === '1') {
      if (typeof DecompressionStream === 'undefined') throw new Error('เบราว์เซอร์นี้เปิดลิงก์ไม่ได้ กรุณาอัปเดตเบราว์เซอร์');
      bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function fail(msg) { document.getElementById('app').innerHTML = `<div style="padding:80px 32px;text-align:center"><p style="font-weight:600">เปิดลิงก์ห้องไม่ได้</p><p class="mut" style="margin-top:4px">${esc(msg)}</p></div>`; }
  let timer;
  async function main() {
    clearInterval(timer);
    const h = location.hash.slice(1), qid = new URLSearchParams(location.search).get('id');
    let d;
    if (qid) {
      document.getElementById('app').innerHTML = '<p class="mut" style="text-align:center;margin-top:96px">กำลังโหลด...</p>';
      try { const r = await fetch(`${SB_URL}/functions/v1/share-room?id=${encodeURIComponent(qid)}`, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } }); const j = await r.json(); if (!r.ok || !j.data) throw 0; d = j.data; }
      catch (e) { return fail('ไม่พบห้องนี้ หรือการเชื่อมต่อมีปัญหา กรุณาลองใหม่'); }
    } else if (!h) return fail('ลิงก์ไม่สมบูรณ์ กรุณาขอลิงก์ใหม่จากเอเจนต์');
    if (!d) try { d = await decode(h); } catch (e) { return fail(e.message && e.message.includes('เบราว์เซอร์') ? e.message : 'ลิงก์ไม่สมบูรณ์ กรุณาขอลิงก์ใหม่จากเอเจนต์'); }
    const desc = String(d.d || '');
    document.title = (d.p || 'ห้องให้เช่า') + (d.rent ? ' — ' + baht(d.rent) + '/เดือน' : '');
    const a = d.a || {};
    const lineUrl = a.l ? 'https://line.me/R/ti/p/~' + encodeURIComponent(a.l.replace(/^@?/, a.l.startsWith('@') ? '@' : '')) : '';
    const tel = a.ph ? 'tel:' + a.ph.replace(/[^0-9+]/g, '') : '';
    const imgs = d.imgs && d.imgs.length ? d.imgs : (d.img ? ['data:image/jpeg;base64,' + d.img] : []);
    const isSale = d.sale && !d.rent;
    // station: stored field, else from description (e.g. "BTS พระโขนง 300 ม.")
    let sn = d.sn || '', sd = Number(d.sd) || 0;
    if (!sn) { const m = desc.match(/(BTS|MRT|ARL|Airport Link)\s*([ก-๙A-Za-z0-9 ]+?)(?:\s*(?:เพียง|ประมาณ)?\s*([\d,.]+)\s*(ม\.|เมตร|m|km|กม\.))?(?=[\s|,·\n]|$)/); if (m) { sn = (m[1] + ' ' + m[2].replace(/\s*(ฟรี|free)$/i, '')).trim(); if (m[3]) sd = parseFloat(m[3].replace(/,/g, '')) * (/k|กม/.test(m[4]) ? 1000 : 1); } }
    const area = sn ? sn.replace(/^(BTS|MRT|ARL|Airport Link)\s*/i, '').trim() : (d.b && d.b.length > 2 ? d.b : '');
    const corner = /ห้องมุม|corner/i.test(desc);
    const dist = sd ? (sd >= 1000 ? (sd / 1000).toLocaleString('th-TH') + ' กม.' : sd.toLocaleString('th-TH') + ' ม.') : '';
    const typ = [d.t ? String(d.t).replace(/(\d+)\s*Bed(room)?s?/i, '$1 ห้องนอน').replace(/Studio/i, 'สตูดิโอ') : '', d.bt ? d.bt + ' ห้องน้ำ' : ''].filter(Boolean).join(' · ');
    const flo = [d.f ? 'ชั้น ' + d.f : '', corner ? 'ห้องมุม' : '', d.r && d.r !== '-' ? 'ห้อง ' + d.r : ''].filter(Boolean).join(' · ');
    const rows = [['ประเภทห้อง', typ], ['ขนาด', d.sz ? d.sz + ' ตร.ม.' : ''], ['ชั้น / ตำแหน่ง', flo], ['วิว', d.vw || ''], ['การเดินทาง', sn ? sn + (dist ? ' ' + dist : '') : '']].filter(r => r[1]);
    // rental terms parsed from description
    const tm = [];
    let m;
    if ((m = desc.match(/สัญญา[^\n\d]*?(\d+)\s*(ปี|เดือน)/))) tm.push(['สัญญาขั้นต่ำ', m[1] + ' ' + m[2]]);
    else if ((m = desc.match(/minimum[^\n\d]*?(\d+)[\s-]*(year|month)/i))) tm.push(['สัญญาขั้นต่ำ', m[1] + ' ' + (/y/i.test(m[2]) ? 'ปี' : 'เดือน')]);
    if ((m = desc.match(/ล่วงหน้า\s*(\d+)\s*เดือน/))) tm.push(['ล่วงหน้า', m[1] + ' เดือน']);
    if ((m = desc.match(/(?:ประกัน|มัดจำ)\s*(\d+)\s*เดือน/))) tm.push(['เงินประกัน', m[1] + ' เดือน']);
    const st = ST[d.st];
    const q = encodeURIComponent(d.p || '');
    const tbl = list => `<div class="card" style="padding:4px 14px">${list.map(([k, v]) => `<div class="row"><span style="color:#8e8680">${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`;
    const btns = `${lineUrl ? `<a class="btn" style="background:#06c755" href="${lineUrl}">ทัก LINE</a>` : ''}${tel ? `<a class="btn" style="background:${B}" href="${tel}">โทรหาเอเจนต์</a>` : ''}`;
    document.getElementById('app').innerHTML = `
    <div class="lay"><div class="colL"><div class="car o1" id="car">
      ${imgs.length ? `<div class="trk" id="trk">${imgs.concat(imgs.length > 1 ? [imgs[0]] : []).map((u, i) => `<img src="${esc(u)}" alt="" ${i > 1 ? 'loading="lazy"' : ''}>`).join('')}</div>` : ''}
      <div class="fade"></div>
      <span class="pill" style="left:16px;background:${B};color:#fff">${isSale ? 'ขาย' : 'ให้เช่า'}${st && d.st === 'AVAILABLE' ? ' · ว่าง' : ''}</span>
      ${imgs.length ? `<span class="pill" style="right:16px;background:rgba(0,0,0,.55);color:#fff;font-weight:500">📷 ${imgs.length} · แตะดูรูป</span>` : ''}
      ${imgs.length > 1 ? `<div class="dots">${imgs.map((_, i) => `<span class="dot${i ? '' : ' on'}"></span>`).join('')}</div>` : ''}
    </div>
    ${imgs.length > 1 ? `<div class="thumbs">${imgs.slice(0, 12).map((u, k) => `<img src="${esc(u)}" alt="" loading="lazy" data-k="${k}">`).join('')}</div>` : ''}
    ${d.p ? `<div class="sec o4" style="margin-top:20px"><div class="h2">ทำเลที่ตั้ง</div>
      <iframe src="https://maps.google.com/maps?q=${q}&z=16&hl=th&output=embed" style="width:100%;height:240px;border:0;border-radius:14px;display:block;background:#eee" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="แผนที่"></iframe>
      <a class="card" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener" style="margin-top:12px;padding:12px;display:flex;align-items:center;gap:10px">
        ${sn ? `<span style="width:36px;height:36px;border-radius:10px;background:#62b04a;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">${esc(sn.split(' ')[0])}</span>` : `<span style="width:36px;height:36px;border-radius:10px;background:#fdf3ee;color:${B};font-size:18px;display:flex;align-items:center;justify-content:center">📍</span>`}
        <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(sn ? 'สถานี' + sn.replace(/^(BTS|MRT|ARL|Airport Link)\s*/i, '') : d.p)}</div>${sn && dist ? `<div class="mut">ห่างประมาณ ${dist}</div>` : ''}</div>
        <span style="font-size:13px;color:${B};font-weight:600;white-space:nowrap">เปิด Google Maps ›</span></a></div>` : ''}
    </div><div class="colR">
    <div class="sec o2" style="margin-top:8px">
      <div style="font-size:12px;letter-spacing:2px;color:${B};font-weight:600">${isSale ? 'ขาย' : 'ให้เช่า'}${area ? ' · ' + esc(area) : ''}</div>
      <h1 style="font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;line-height:1.1;margin-top:2px">${esc(d.p || 'ห้องให้เช่า')}</h1>
      <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin-top:8px">
        ${d.rent ? `<span><span style="font-size:26px;font-weight:600;color:${B}">${baht(d.rent)}</span><span style="font-size:15px;color:#7a716b;margin-left:4px">/ เดือน</span></span>` : ''}
        ${d.sale ? `<span style="font-size:${d.rent ? 13 : 26}px;font-weight:600;color:${d.rent ? '#7a716b' : B}">${d.rent ? 'ราคาขาย ' : ''}${baht(d.sale)}</span>` : ''}
        ${st ? `<span style="margin-left:auto;font-size:13px;color:${st[1]};font-weight:600">${st[0]}</span>` : ''}
      </div>
    </div>
    ${rows.length ? `<div class="sec o3" style="margin-top:16px">${tbl(rows)}</div>` : ''}
    ${tm.length ? `<div class="sec o5" style="margin-top:20px"><div class="h2">เงื่อนไขการเช่า</div>${tbl(tm)}</div>` : ''}
    <div class="sec o6" style="margin-top:16px"><div class="card" style="display:flex;align-items:center;gap:12px;padding:12px 14px"><div style="width:44px;height:44px;border-radius:50%;background:${B};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">${esc((a.n || 'M').slice(0, 1))}</div><div><div style="font-weight:600">${esc(a.n || 'เอเจนต์')}</div><div class="mut">${esc([a.ph, a.l ? 'LINE ' + a.l : ''].filter(Boolean).join(' · ') || 'เอเจนต์อสังหาฯ')}</div></div></div></div>
    ${btns ? `<div class="ibtns">${btns}</div>` : ''}
    <p class="mut o7" style="font-size:11px;text-align:center;padding:16px 16px 0">ข้อมูลจากเอเจนต์ ณ วันที่ส่งลิงก์ ราคาและสถานะอาจเปลี่ยนแปลง</p></div></div>
    ${btns ? `<div class="bar"><div>${btns}</div></div>` : ''}
    <div id="gal" role="dialog" aria-modal="true"><div id="gtrk">${imgs.map(u => `<div><img src="${esc(u)}" alt="" loading="lazy"></div>`).join('')}</div><span class="gc" id="gc"></span><button class="gx" id="gx" aria-label="ปิด">✕</button>${imgs.length > 1 ? '<button class="gnav" id="gp" style="left:16px" aria-label="ก่อนหน้า">‹</button><button class="gnav" id="gn" style="right:16px" aria-label="ถัดไป">›</button>' : ''}</div>`;
    if (!imgs.length) return;
    const car = document.getElementById('car'), trk = document.getElementById('trk'), dots = car.querySelectorAll('.dot'), n = imgs.length;
    let i = 0;
    const go = () => { i++; trk.style.transition = 'transform .6s ease'; trk.style.transform = `translateX(${-i * 100}%)`; dots.forEach((e, k) => e.classList.toggle('on', k === i % n)); if (i === n) setTimeout(() => { trk.style.transition = 'none'; trk.style.transform = 'translateX(0)'; i = 0; }, 650); };
    const start = () => { clearInterval(timer); if (n > 1) timer = setInterval(go, 2500); };
    start();
    const gal = document.getElementById('gal'), gt = document.getElementById('gtrk'), gc = document.getElementById('gc');
    const upd = () => { gc.textContent = `${Math.round(gt.scrollLeft / gt.clientWidth) + 1} / ${n}`; };
    gt.addEventListener('scroll', upd, { passive: true });
    const close = () => { gal.classList.remove('on'); document.documentElement.style.overflow = ''; start(); };
    const openG = k => { clearInterval(timer); gal.classList.add('on'); document.documentElement.style.overflow = 'hidden'; gt.scrollLeft = k * gt.clientWidth; upd(); };
    car.addEventListener('click', () => openG(i % n));
    document.querySelectorAll('.thumbs img').forEach(t => t.onclick = () => openG(+t.dataset.k));
    const step = dx => gt.scrollBy({ left: dx * gt.clientWidth, behavior: 'smooth' });
    if (n > 1) { document.getElementById('gp').onclick = () => step(-1); document.getElementById('gn').onclick = () => step(1); }
    gal.addEventListener('click', e => { if (e.target === gal || e.target.tagName === 'DIV' && e.target.parentNode === gt) close(); });
    document.getElementById('gx').onclick = close;
    let sy = 0; gt.addEventListener('touchstart', e => { sy = e.touches[0].clientY; }, { passive: true });
    gt.addEventListener('touchend', e => { if (e.changedTouches[0].clientY - sy > 100) close(); }, { passive: true });
    document.onkeydown = e => { if (!gal.classList.contains('on')) return; if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') gt.scrollBy({ left: gt.clientWidth, behavior: 'smooth' }); else if (e.key === 'ArrowLeft') gt.scrollBy({ left: -gt.clientWidth, behavior: 'smooth' }); };
  }
  main();
  window.addEventListener('hashchange', main);
})();
</script>
</body>
</html>
