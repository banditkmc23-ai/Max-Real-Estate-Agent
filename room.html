<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ห้องให้เช่า — MAX Agent</title>
<meta name="description" content="รายละเอียดห้องให้เช่า ราคา รูป และช่องทางติดต่อเอเจนต์">
<meta property="og:title" content="ห้องให้เช่า — MAX Agent">
<meta property="og:image" content="https://banditkmc23-ai.github.io/Max-Real-Estate-Agent/icons/icon-512.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tailwind.min.css?v=16">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  body { font-family: 'Poppins', 'Noto Sans Thai', -apple-system, sans-serif; background:#f4f2ef; color:#1c1917; -webkit-font-smoothing: antialiased; }
  .hero-ph { background: linear-gradient(135deg, #cf7a56 0%, #83401f 100%); }
</style>
</head>
<body>
<div id="app" class="max-w-[560px] mx-auto pb-32"></div>
<script>
(function () {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const baht = n => '฿' + Number(n || 0).toLocaleString('th-TH');
  const ST = { AVAILABLE: ['ว่าง พร้อมเข้าอยู่', 'bg-emerald-500/10 text-emerald-700'], RESERVED: ['ติดจอง', 'bg-amber-500/10 text-amber-700'], OCCUPIED: ['มีผู้เช่า (รับจองล่วงหน้า)', 'bg-sky-500/10 text-sky-700'], FOR_SALE: ['ขาย', 'bg-brick-500/10 text-brick-700'] };
  const fromB64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; };
  async function decode(h) {
    const [ver, data] = [h.slice(0, 1), h.slice(2)];
    let bytes = fromB64u(data);
    if (ver === '1') {
      if (typeof DecompressionStream === 'undefined') throw new Error('เบราว์เซอร์นี้เปิดลิงก์ไม่ได้ กรุณาอัปเดตเบราว์เซอร์');
      bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function fail(msg) { document.getElementById('app').innerHTML = `<div class="p-8 text-center mt-20"><div class="w-14 h-14 rounded-2xl bg-brick-500/10 flex items-center justify-center mx-auto mb-3"><i data-lucide="link-2-off" class="w-7 h-7 text-brick-500"></i></div><p class="text-sm font-semibold">เปิดลิงก์ห้องไม่ได้</p><p class="text-xs text-slate-400 mt-1">${esc(msg)}</p></div>`; lucide.createIcons(); }
  async function main() {
    const h = location.hash.slice(1);
    if (!h) return fail('ลิงก์ไม่สมบูรณ์ กรุณาขอลิงก์ใหม่จากเอเจนต์');
    let d; try { d = await decode(h); } catch (e) { return fail(e.message && e.message.includes('เบราว์เซอร์') ? e.message : 'ลิงก์ไม่สมบูรณ์ กรุณาขอลิงก์ใหม่จากเอเจนต์'); }
    const title = [d.p, d.r ? 'ห้อง ' + d.r : ''].filter(Boolean).join(' · ');
    document.title = (d.p || 'ห้องให้เช่า') + ' — ' + baht(d.rent) + '/เดือน';
    const st = ST[d.st] || null;
    const spec = (icon, label) => label ? `<div class="bg-slate-950 rounded-xl py-2.5 px-1 text-center"><i data-lucide="${icon}" class="w-4 h-4 mx-auto text-brick-500"></i><p class="text-xs font-semibold mt-1">${esc(label)}</p></div>` : '';
    const a = d.a || {};
    const lineUrl = a.l ? 'https://line.me/R/ti/p/~' + encodeURIComponent(a.l.replace(/^@?/, a.l.startsWith('@') ? '@' : '')) : '';
    const tel = a.ph ? 'tel:' + a.ph.replace(/[^0-9+]/g, '') : '';
    document.getElementById('app').innerHTML = `
      <div class="relative h-72 ${d.img ? '' : 'hero-ph'} overflow-hidden lg:rounded-b-3xl">
        ${d.img ? `<img src="data:image/jpeg;base64,${d.img}" class="absolute inset-0 w-full h-full object-cover" alt="">` : `<div class="absolute inset-0 flex items-center justify-center opacity-30"><i data-lucide="building-2" class="w-24 h-24 text-white"></i></div>`}
        <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(28,25,23,.35),transparent 40%,rgba(28,25,23,.55))"></div>
        <div class="absolute top-[max(16px,env(safe-area-inset-top))] left-4 right-4 flex justify-between"><span class="bg-white/90 text-brick-700 text-xs font-semibold px-3 py-1.5 rounded-full">${d.sale && !d.rent ? 'ขาย' : 'ให้เช่า'}</span></div>
        <div class="absolute bottom-4 left-4 right-4 text-white"><p class="text-xs opacity-90">${esc(d.b || '')}</p><h1 class="text-2xl font-bold leading-tight">${esc(title || 'ห้องให้เช่า')}</h1></div>
      </div>
      <div class="px-4 space-y-3 mt-3">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-700">
          <div class="flex items-end justify-between gap-2 flex-wrap"><div><p class="text-xs text-slate-400">ค่าเช่า</p><p class="text-3xl font-bold text-brick-600">${baht(d.rent)}<span class="text-sm text-slate-400 font-medium">/เดือน</span></p>${d.sale ? `<p class="text-xs text-slate-400">ราคาขาย ${baht(d.sale)}</p>` : ''}</div>${st ? `<span class="text-[11px] ${st[1]} px-2.5 py-1 rounded-full font-semibold">${st[0]}</span>` : ''}</div>
          <div class="grid grid-cols-4 gap-2 mt-4">${spec('maximize', d.sz ? d.sz + ' ตร.ม.' : '')}${spec('layers', d.f ? 'ชั้น ' + d.f : '')}${spec('bed-double', d.t)}${spec('bath', d.bt ? d.bt + ' ห้องน้ำ' : '')}${spec('mountain', d.vw ? 'วิว ' + d.vw : '')}</div>
        </div>
        ${d.d ? `<div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-700"><h2 class="text-sm font-semibold mb-2">รายละเอียด</h2><p class="text-xs text-slate-300 leading-relaxed whitespace-pre-line">${esc(d.d)}</p></div>` : ''}
        ${d.p ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.p)}" target="_blank" rel="noopener" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-700 flex items-center gap-3"><div class="w-11 h-11 rounded-xl bg-brick-500/10 flex items-center justify-center"><i data-lucide="map-pin" class="w-5 h-5 text-brick-600"></i></div><div class="flex-1 min-w-0"><p class="text-sm font-semibold">ดูทำเลบนแผนที่</p><p class="text-[11px] text-slate-400 truncate">${esc(d.p)}</p></div><i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i></a>` : ''}
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-700 flex items-center gap-3"><div class="w-12 h-12 rounded-full bg-gradient-to-br from-brick-400 to-brick-600 text-white font-bold flex items-center justify-center">${esc((a.n || 'M').slice(0, 1))}</div><div class="flex-1"><p class="text-sm font-semibold">${esc(a.n || 'เอเจนต์')}</p><p class="text-[11px] text-slate-400">เอเจนต์อสังหาฯ${a.l ? ' · LINE ' + esc(a.l) : ''}</p></div><i data-lucide="badge-check" class="w-5 h-5 text-brick-500"></i></div>
        <p class="text-[10px] text-slate-400 text-center pt-2">ข้อมูลจากเอเจนต์ ณ วันที่ส่งลิงก์ ราคาและสถานะอาจเปลี่ยนแปลง</p>
      </div>
      <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-800 p-3 pb-[max(14px,env(safe-area-inset-bottom))] rounded-t-2xl shadow-lg"><div class="max-w-[560px] mx-auto grid ${lineUrl && tel ? 'grid-cols-2' : 'grid-cols-1'} gap-2">
        ${lineUrl ? `<a href="${lineUrl}" class="py-3 rounded-full font-semibold text-white text-sm flex items-center justify-center gap-2" style="background:#06C755"><i data-lucide="message-circle" class="w-4 h-4"></i>ทัก LINE</a>` : ''}
        ${tel ? `<a href="${tel}" class="py-3 rounded-full font-semibold text-white text-sm bg-brick-500 flex items-center justify-center gap-2"><i data-lucide="phone" class="w-4 h-4"></i>โทรหาเอเจนต์</a>` : ''}
      </div></div>`;
    lucide.createIcons();
  }
  main();
  window.addEventListener('hashchange', main);
})();
</script>
</body>
</html>
